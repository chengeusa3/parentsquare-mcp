[project]
name = "parentsquare-mcp"
version = "0.1.0"
description = "MCP server for ParentSquare — read school feeds, posts, calendars, directory, signups and more from your own parent account."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
    "pypdf>=4.2",
]

[project.scripts]
parentsquare-mcp = "parentsquare_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["parentsquare_mcp*"]
